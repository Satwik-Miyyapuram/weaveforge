[project]
name = "weaveforge"
dynamic = ["version"]
description = "Push experiments, training curves, and figures (TensorBoard / wandb / matplotlib) into your self-hosted WeaveForge dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Satwik Miyyapuram" }]
keywords = [
  "experiment-tracking", "machine-learning", "tensorboard", "wandb",
  "mlops", "research", "thesis", "supabase",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "supabase>=2.4",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/Satwik-Miyyapuram/weaveforge"
Repository = "https://github.com/Satwik-Miyyapuram/weaveforge"
Issues = "https://github.com/Satwik-Miyyapuram/weaveforge/issues"

[project.optional-dependencies]
# Sync sources are opt-in so the base install stays light; each source stays
# registered-but-unavailable until its extra is present.
figures = ["matplotlib>=3.6", "pillow>=10.0"]
tensorboard = ["tbparse>=0.0.8"]
wandb = ["wandb>=0.16"]
lightning = ["lightning>=2.0"]
keras = ["keras>=3.0"]
all = [
  "matplotlib>=3.6", "pillow>=10.0", "tbparse>=0.0.8", "wandb>=0.16",
  "lightning>=2.0", "keras>=3.0",
]
dev = ["pytest>=8.0"]

[project.scripts]
weaveforge = "weaveforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "weaveforge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["weaveforge"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["weaveforge"]
