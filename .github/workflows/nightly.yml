name: Nightly

on:
  # Schedule off while the private repo's Actions minutes are used up, as in ci.yml.
  # schedule:
  #   - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proptest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROPTEST_CASES: "10000"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Same toolchain install and cache as the ci.yml rust job.
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Property tests, 10k cases, fixed seeds
        run: cargo test --release -p wf-core

      - name: Property tests, fresh seed
        env:
          PROPTEST_RNG_SEED: ${{ github.run_id }}
        run: |
          echo "seed $PROPTEST_RNG_SEED"
          cargo test --release -p wf-core

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install nightly Rust toolchain
        run: rustup toolchain install nightly --profile minimal

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.1 --locked

      - name: Fuzz the sync parsers for 20 minutes
        working-directory: fuzz
        run: cargo +nightly fuzz run sync_parsers -- -max_total_time=1200 -rss_limit_mb=2048

      - name: Keep crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
