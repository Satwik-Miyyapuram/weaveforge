name: Release desktop app

# Builds the desktop installers and publishes them to the GitHub Release for
# the tag, together with the `latest*.yml` feed the in-app updater reads.
#
# Trigger: tag vX.Y.Z. That prefix is deliberate and is not free to change:
# copies already installed on people's machines look for `v*` releases (see
# `apps/desktop/src/update-check.ts`), so moving the desktop track to another
# prefix would strand every one of them on the version they have.
#
# The Python SDK is on `py-v*` and Android on `android-v*`; neither runs here.
#
# SECURITY: the Windows and macOS builds are not code-signed. What a downloaded
# update is checked against is the SHA-512 in `latest.yml`, fetched over HTTPS
# from this same release — see the note in `apps/desktop/src/auto-update.ts`.
# Signing certificates are the fix; until they exist, this is what an update is
# worth, and the release notes should not claim otherwise.

# A manual run builds and uploads workflow artifacts only. Releases are made by
# tags, never by hand — see the note on the build step.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Made once, before the builds, so the three jobs upload into one draft
  # instead of racing to create it.
  prepare:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Create the draft release
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --title "WeaveForge $tag" --notes ""

  build:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result != 'failure' }}
    strategy:
      # One platform failing must not withdraw the installers that did build:
      # a release with Windows and Linux on it is worth more than no release.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # No signing certificate exists, and electron-builder's default is to go
      # looking for one in the keychain and fail the macOS build when it finds
      # nothing. Unsigned is the deliberate state — see the note at the top.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_BACKEND_PROVIDER: supabase
      # Auth stays on Supabase; the tables do not. Without these the bundled
      # app falls back to the sign-in project's own REST endpoint, whose schema
      # is frozen at migration 0111 — which is exactly what v0.7.0 shipped:
      # `column vault_pages.pinned does not exist`, `report_sections.updated_at`
      # missing, `ensure_user_provisioned` a 404, and every write refused by
      # RLS because the rows it wrote belonged to nobody in that database.
      #
      # `NEXT_PUBLIC_*` is inlined when the web export is built, so a copy
      # already installed cannot be redirected at runtime: the only fix for a
      # bad build is a new one. The web build sets the same two — see ci.yml,
      # whose comment describes this failure before it happened to a release.
      NEXT_PUBLIC_DATA_URL: https://api.weaveforge.org
      NEXT_PUBLIC_REALTIME_URL: https://api.weaveforge.org
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The tag is the claim; the package is the fact. A mismatch here ships an
      # installer that tells the updater it is a version it is not, and every
      # installed copy would then either miss the update or reinstall forever.
      - name: Check the tag matches the desktop version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match apps/desktop/package.json $pkg" >&2
            exit 1
          fi

      - name: Build Core package
        run: npm run build:core

      # The Windows half needs both rust targets for the per-chip setup window.
      - name: Add the Windows rust targets
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc

      # Builds the app, exports the offline web build into it, and uploads the
      # installers plus the update feed to the draft. Windows builds one
      # installer per chip and never publishes here; see scripts/package.mjs.
      - name: Build and publish the installers
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run package --workspace @weaveforge/desktop -- --publish always

      # A manual run is a build test, and it must not touch the releases. It
      # used to run `--publish always`, which creates the release as a draft —
      # and the `publish` job below is tag-gated, so nothing ever un-drafted it.
      # The result was a v0.6.0 that existed, held every installer, and was
      # invisible to every installed copy, because `newestRelease()` skips
      # drafts (apps/desktop/src/update-check.ts). It cost an afternoon to work
      # out. Manual runs now build to workflow artifacts and stop there.
      - name: Build the installers (manual run — no release)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npm run package --workspace @weaveforge/desktop -- --publish never

      # The failure this guards was silent, and it left the building: v0.7.0
      # installed, launched, signed in, and showed an empty workspace, because
      # the export had no data API baked in and quietly read the pre-cutover
      # database instead. Nothing in the app's own log says "wrong database" —
      # it says a missing column and a refused write, which reads like ten bugs.
      #
      # `NEXT_PUBLIC_*` is inlined at export time, so the built files are the
      # only place the answer can be read, and reading it costs a second. The
      # *export* is checked rather than the packed app: electron-builder packs
      # `dist/**`, and the main process's sourcemaps name this host inside a
      # comment, so a check aimed at the whole bundle would pass on a build
      # that never had the variable set — which is the bug, not the fix.
      - name: Verify the export carries the data API
        shell: bash
        run: |
          export_dir="apps/desktop/dist/web"
          if [ ! -f "$export_dir/index.html" ]; then
            echo "::error::$export_dir is not an export — the web build step did not run."
            exit 1
          fi
          if ! grep -rqF "https://api.weaveforge.org" "$export_dir/_next"; then
            echo "::error::The exported app never names https://api.weaveforge.org, so an installed copy would read Supabase's frozen schema (migration 0111) instead of the OCI database. Check NEXT_PUBLIC_DATA_URL and NEXT_PUBLIC_REALTIME_URL in this job's env."
            exit 1
          fi
          echo "The export points at the OCI data API."

      # One themed setup per chip, each carrying that chip's NSIS installer.
      # The `-update.exe` files stay on the release too: the merged
      # `latest.yml` names them, and the updater runs them silently.
      - name: Pack the themed Windows setups
        if: runner.os == 'Windows'
        run: |
          npm run pack:setup --workspace @weaveforge/desktop -- --arch x64
          npm run pack:setup --workspace @weaveforge/desktop -- --arch arm64

      - name: Add the Windows files to the release
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd apps/desktop/release
          gh release upload "${GITHUB_REF#refs/tags/}" --clobber \
            WeaveForge-*-Windows-*-Installer.exe \
            WeaveForge-*-update.exe WeaveForge-*-update.exe.blockmap latest.yml

      - name: Upload the installers as workflow artifacts
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/latest*.yml
          if-no-files-found: warn
          retention-days: 7

  publish:
    # electron-builder leaves the release a draft so three platforms can upload
    # into it without racing to announce a half-filled one. Nothing is visible
    # to the updater until this step, which runs once they are all done.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Publish the release
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --draft=false --title "WeaveForge $tag" --latest
          else
            echo "no release for $tag — every platform build must have failed" >&2
            exit 1
          fi

      # The whole point of this job is that the release stops being a draft, so
      # say out loud that it did. A draft is indistinguishable from a missing
      # release to an installed copy, and a green tick on a run that quietly
      # left one behind is how that goes unnoticed for a month.
      - name: Confirm the release is visible to the updater
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          draft="$(gh release view "$tag" --json isDraft -q .isDraft)"
          feed="$(gh release view "$tag" --json assets -q '[.assets[].name] | index("latest.yml")')"
          if [ "$draft" != "false" ]; then
            echo "$tag is still a draft — installed copies cannot see it" >&2
            exit 1
          fi
          if [ "$feed" = "null" ]; then
            echo "$tag has no latest.yml — the Windows updater has nothing to read" >&2
            exit 1
          fi
          echo "$tag is published and carries latest.yml"
