name: Release desktop

# Builds the signed Windows installers for a desktop tag (vX.Y.Z), writes the
# updater manifest, and publishes them as a GitHub pre-release. Promotion to
# Latest stays manual (docs/building/release.md), because the in-app updater
# reads latest-v2.json from the Latest release only.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing desktop tag to build (vX.Y.Z)
        required: true

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Runs before any build, so a release candidate or any other non-vX.Y.Z tag
  # (for example v0.9.7-rc1) never reaches the installers or the manifest.
  validate:
    name: validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject tags that are not vX.Y.Z
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG is not vX.Y.Z. Release candidates are not built here."
            exit 1
          fi
  build:
    name: build (${{ matrix.arch }})
    needs: validate
    strategy:
      fail-fast: true
      matrix:
        include:
          # Each arch builds natively, so the ink recogniser and the Rust crates
          # match the installer without cross-compiling.
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # The web export refuses to build without these (scripts/build-web.mjs).
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_BACKEND_PROVIDER: postgrest
      NEXT_PUBLIC_DATA_URL: https://api.weaveforge.org
      NEXT_PUBLIC_REALTIME_URL: https://api.weaveforge.org
      NEXT_PUBLIC_RELAY_URL: https://api.weaveforge.org/relay
      # createUpdaterArtifacts (tauri.bundle.json) signs each installer with these.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: apps/shell
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          # The Overleaf IDE and its vim fork (third_party/README.md).
          submodules: true

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        working-directory: .
        run: npm ci

      # The bindings and WASM package are git-ignored, and core's types come from them.
      - uses: ./.github/actions/generate

      - name: Build Core package
        working-directory: .
        run: npm run build:core

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build web export
        run: node scripts/build-web.mjs

      - name: Stage ink recogniser
        working-directory: .
        shell: pwsh
        # An arm64 installer also carries the x64 helper (ink_recogniser_path falls back to it),
        # so build both arches and let the stage script pick what this installer needs.
        run: |
          if (Test-Path apps/shell/target/stage) { Remove-Item apps/shell/target/stage -Recurse -Force }
          node apps/shell/scripts/build-ink-recogniser.mjs
          if ($LASTEXITCODE -ne 0) { throw "ink recogniser build failed" }
          node apps/shell/scripts/stage-ink-recogniser.mjs apps/shell/target/stage --arch=${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { throw "ink recogniser stage failed" }

      - name: Bundle
        run: npm run tauri -- build --bundles msi,nsis --config tauri.bundle.json

      - name: Collect installers
        working-directory: .
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "installers"
          New-Item -ItemType Directory -Force $out | Out-Null
          $files = Get-ChildItem target/release/bundle -Recurse -Include *.msi, *-setup.exe, *-setup.exe.sig
          if (-not ($files | Where-Object Name -like "*_${{ matrix.arch }}-setup.exe.sig")) { throw "no signed ${{ matrix.arch }} installer" }
          $files | Copy-Item -Destination $out
          Get-ChildItem $out | ForEach-Object { "$($_.Name) $([math]::Round($_.Length / 1MB, 2)) MiB" }

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.arch }}
          path: ${{ runner.temp }}/installers
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1

      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true

      # Later releases keep latest.json at the 0.9.7 bridge; fetch it from v0.9.7.
      - name: Fetch the 0.9.7 bridge manifest
        if: env.TAG != 'v0.9.7'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.9.7 --pattern latest.json --dir bridge

      # The writer fails on a non-canonical tag, a missing .sig, a tauri.conf.json version other than the tag, or a bridge that is not the 0.9.7 latest.json. The bridge is fetched from v0.9.7, so the byte check holds.
      - name: Write latest-v2.json and latest.json
        run: |
          bridge=""
          if [ "$TAG" != "v0.9.7" ]; then bridge="bridge/latest.json"; fi
          node apps/shell/scripts/write-latest-json.mjs "$TAG" dist $bridge

      - name: Release notes from CHANGELOG
        run: |
          version="${TAG#v}"
          awk -v head="## [$version]" 'index($0, head) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "no CHANGELOG entry for $version" >&2; exit 1; fi

      # A failed earlier run can leave a draft for this tag; delete only drafts, never a published release.
      - name: Remove a leftover draft for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\" and .draft == true) | .id")
          for id in $ids; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done

      # Created as a draft so nothing is public until the gate passes.
      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --verify-tag --draft --prerelease --title "WeaveForge $TAG" --notes-file notes.md dist/*

      # Reads the draft back (the check finds drafts by tag); the job fails if an installer, a .sig or a manifest is wrong.
      - name: Check the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/shell/scripts/check-release-assets.mjs "$TAG"

      # Publishes the pre-release only after the check passed. Latest stays a manual promotion.
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false

      # Strict re-check of the published release: its URLs must be the tagged ones.
      - name: Check the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/shell/scripts/check-release-assets.mjs "$TAG"
