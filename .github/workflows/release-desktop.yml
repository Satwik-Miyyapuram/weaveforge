name: Release desktop

# Builds the signed Windows installers for a desktop tag (vX.Y.Z), writes the
# updater manifest, and publishes them as a GitHub pre-release. Promotion to
# Latest stays manual (docs/building/release.md), because the in-app updater
# reads latest.json from the Latest release only.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing desktop tag to build (vX.Y.Z)
        required: true

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          # Each arch builds natively, so the Postgres build, the ink recogniser
          # and the Rust crates all match the installer without cross-compiling.
          - arch: x64
            runner: windows-latest
            postgres: postgresql-18.6.1-x86_64-pc-windows-msvc
            postgres_sha256: 0C0C845626ED77C605D716051C9E8DF3368D07FBBD9F61EA39A4C5C0536FDE7E
          - arch: arm64
            runner: windows-11-arm
            postgres: postgresql-18.6.1-aarch64-pc-windows-msvc
            postgres_sha256: 29669A4E020F252D8FF7A59E5E5C4632901FCFF0E5EE7793F8B011A0E2157F68
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # The web export refuses to build without these (scripts/build-web.mjs).
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_BACKEND_PROVIDER: postgrest
      # createUpdaterArtifacts (tauri.bundle.json) signs each installer with these.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: apps/shell
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          # The Overleaf IDE and its vim fork (third_party/README.md).
          submodules: true

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        working-directory: .
        run: npm ci

      # The bindings and WASM package are git-ignored, and core's types come from them.
      - uses: ./.github/actions/generate

      - name: Build Core package
        working-directory: .
        run: npm run build:core

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build web export
        run: node scripts/build-web.mjs

      - name: Stage Postgres
        working-directory: .
        shell: pwsh
        run: |
          if (Test-Path apps/shell/target/stage) { Remove-Item apps/shell/target/stage -Recurse -Force }
          $name = "${{ matrix.postgres }}"
          $tar = Join-Path $env:RUNNER_TEMP "$name.tar.gz"
          Invoke-WebRequest -Uri "https://github.com/theseus-rs/postgresql-binaries/releases/download/18.6.1/$name.tar.gz" -OutFile $tar
          $hash = (Get-FileHash $tar -Algorithm SHA256).Hash
          if ($hash -ne "${{ matrix.postgres_sha256 }}") { throw "Postgres archive hash mismatch: $hash" }
          tar -xzf $tar -C $env:RUNNER_TEMP
          node apps/shell/scripts/stage-postgres.mjs (Join-Path $env:RUNNER_TEMP $name) apps/shell/target/stage

      - name: Stage ink recogniser
        working-directory: .
        shell: pwsh
        # An arm64 installer also carries the x64 helper (ink_recogniser_path falls back to it),
        # so build both arches and let the stage script pick what this installer needs.
        run: |
          node apps/shell/scripts/build-ink-recogniser.mjs
          if ($LASTEXITCODE -ne 0) { throw "ink recogniser build failed" }
          node apps/shell/scripts/stage-ink-recogniser.mjs apps/shell/target/stage --arch=${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { throw "ink recogniser stage failed" }

      - name: Bundle
        run: npm run tauri -- build --bundles msi,nsis --config tauri.bundle.json

      - name: Collect installers
        working-directory: .
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "installers"
          New-Item -ItemType Directory -Force $out | Out-Null
          $files = Get-ChildItem target/release/bundle -Recurse -Include *.msi, *-setup.exe, *-setup.exe.sig
          if (-not ($files | Where-Object Name -like "*_${{ matrix.arch }}-setup.exe.sig")) { throw "no signed ${{ matrix.arch }} installer" }
          $files | Copy-Item -Destination $out
          Get-ChildItem $out | ForEach-Object { "$($_.Name) $([math]::Round($_.Length / 1MB, 2)) MiB" }

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.arch }}
          path: ${{ runner.temp }}/installers
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1

      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true

      # Fails if a .sig is missing or the tag differs from tauri.conf.json.
      - name: Write latest.json
        run: node apps/shell/scripts/write-latest-json.mjs "$TAG" dist

      - name: Release notes from CHANGELOG
        run: |
          version="${TAG#v}"
          awk -v head="## [$version]" 'index($0, head) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "no CHANGELOG entry for $version" >&2; exit 1; fi

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --verify-tag --prerelease --title "WeaveForge $TAG" --notes-file notes.md dist/*
