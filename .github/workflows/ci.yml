name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `feat/offline-first` is a long-lived integration branch that main is
    # protected from until it is finished, so the pull requests into it need
    # the same checks main's do — otherwise the branch merges to main in one
    # untested lump.
    branches: [main, feat/offline-first]
  # Nightly paused: burns private-repo Actions minutes and was red on Playwright.
  # Re-enable after billing/minutes are healthy:
  # schedule:
  #   - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Job-scoped (not workflow-scoped) so a bad secret eval fails the job, not startup.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_BACKEND_PROVIDER: supabase
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json', 'apps/web/src/**', 'packages/core/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Build Core package
        run: npm run build:core

      - name: Run Core tests
        run: npm run test:core

      - name: Run Web unit tests
        run: npm test --workspace @weaveforge/web

      # 147 tests across 6 suites in ~14s, covering the desktop's own modules:
      # the IPC guard, both stores, the vault folder, the loopback API and the
      # app: protocol. They passed and never gated a merge — `check:all` includes
      # test:desktop, but CI runs check:boundaries, not check:all, and grep for
      # test:desktop across .github/workflows returned nothing.
      #
      # No setup of its own: the script is `node --import tsx --test
      # test/*.test.ts`, tsx is a workspace dependency, and the desktop reads no
      # Supabase env var and starts no browser. It does import @weaveforge/core,
      # which is why "Build Core package" above has to stay ahead of it.
      - name: Run Desktop tests
        run: npm run test:desktop

      # Schema and RLS, against the shipped migrations on an in-process
      # Postgres. It used to live in the opt-in job because it needed a live
      # project and two accounts; it needs neither now, so it runs on every PR.
      #
      # This step is also where the schema invariants run — the suite walks both
      # `src/features` and `src/backend`, and
      # `backend/test/schema-invariants.rls.integration.ts` asserts that every
      # public table has RLS, every RLS table has a policy, every `security
      # definer` function pins `search_path`, and no definer function is
      # anon-executable outside its documented allowlist. That is the coverage the
      # review wanted wired in (finding G5); it needs no workflow of its own, and
      # the script that previously asserted the first of those
      # (`scripts/verify-migration.mjs`) still needs two live databases and so
      # still runs nowhere.
      - name: Run schema and RLS tests
        run: npm run test:integration:web

      # Paste, drag and image handling in a real browser, against a page the
      # spec bundles itself: no server and no account, so nothing here needs a
      # secret. It sat in the opt-in job only because it downloads a browser,
      # which meant the one suite covering the editor never ran on a PR.
      - name: Install Chromium for the editor tests
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run editor paste tests
        run: npm run test:e2e:editor

      - name: Run Typechecks
        run: npm run typecheck

      # Kept because it makes the seven gate steps below faster, NOT because they
      # need it: check:solid and check:dry now run the same rules in Node when
      # ripgrep is missing (they used to fail open instead — on Windows a missing
      # `rg` exits 1, which they read as "no matches"). `if: always()` is only so
      # an earlier failure cannot cost the gates their accelerator; it still sits
      # before them, exactly as it always has.
      - name: Install ripgrep (accelerator for the boundary gates)
        if: always()
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # One step per gate, not `check:boundaries`.
      #
      # The chained script stops at the first failure, so a PR used to see a
      # single "Boundary checks" step and no way to tell which of the seven rules
      # rejected it — and a second broken rule could not be found until the first
      # was fixed. Each gate now reports on its own line.
      #
      # `if: always()` is what makes that true: without it the first failing step
      # still stops the job. `check:boundaries` itself is untouched and still runs
      # the same seven in the same order for anyone running it by hand.
      #
      # THE COST OF SPLITTING: this list is now written twice, here and in the
      # `check:boundaries` script. Adding an eighth gate to package.json and not
      # to this list means CI stops running it — silently, and in the direction of
      # less checking. Whoever edits `check:boundaries` should edit this too, and
      # the boundary-checks table in docs/building/dev.md is generated from the
      # script, so it will not prompt anyone.
      #
      # Each step carries an `id` because the summary at the end reads
      # `steps.<id>.outcome`. A step's `name` is not its id, and ids cannot hold a
      # colon — so the ids are `gate_*` while the names stay the script names.
      #
      # The aggregate step after them is what keeps the job red: `if: always()`
      # means a failure no longer stops the job by itself, so it is collected
      # explicitly rather than left to chance.
      - name: check:solid
        id: gate_solid
        if: always()
        run: npm run check:solid

      - name: check:dry
        id: gate_dry
        if: always()
        run: npm run check:dry

      - name: check:api-route-tests
        id: gate_routes
        if: always()
        run: npm run check:api-route-tests

      - name: check:ui
        id: gate_ui
        if: always()
        run: npm run check:ui

      - name: check:hygiene
        id: gate_hygiene
        if: always()
        run: npm run check:hygiene

      - name: check:mcp-plugin
        id: gate_mcp
        if: always()
        run: npm run check:mcp-plugin

      - name: check:docs
        id: gate_docs
        if: always()
        run: npm run check:docs

      # Fails when any gate above failed, naming them.
      #
      # Without this step the job would go green with a red gate in it, because
      # `if: always()` on the gates means a failure no longer stops the job on its
      # own.
      #
      # Anything that is not exactly "success" counts as a failure — "failure",
      # "cancelled" and "skipped" all mean the rule did not run cleanly, and a
      # skipped gate silently proving nothing is the exact failure mode these
      # gates were just fixed for.
      - name: Boundary checks summary
        if: always()
        run: |
          failed=""
          check() {
            if [ "$2" != "success" ]; then failed="$failed $1($2)"; fi
          }
          check "check:solid"           "${{ steps.gate_solid.outcome }}"
          check "check:dry"             "${{ steps.gate_dry.outcome }}"
          check "check:api-route-tests" "${{ steps.gate_routes.outcome }}"
          check "check:ui"              "${{ steps.gate_ui.outcome }}"
          check "check:hygiene"         "${{ steps.gate_hygiene.outcome }}"
          check "check:mcp-plugin"      "${{ steps.gate_mcp.outcome }}"
          check "check:docs"            "${{ steps.gate_docs.outcome }}"
          if [ -n "$failed" ]; then
            echo "::error::boundary gate(s) did not pass:$failed"
            exit 1
          fi
          echo "all seven boundary gates passed"

      - name: Lint Web App
        run: npm run lint --workspace @weaveforge/web

      - name: Build Web App
        run: npm run build --workspace @weaveforge/web

      # After the build, because the build is what regenerates the registry this
      # compares against the deploy config.
      - name: Deployment surface
        run: npm run check:deployment-surface

      # A desktop release left as a draft is invisible to every installed copy,
      # and nothing about the app says so — it simply reports no update. This
      # is the only place that would notice.
      - name: No desktop release left as a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run check:release-drafts

  full-validation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Core package
        run: npm run build:core

      - name: Build Web App
        run: npm run build --workspace @weaveforge/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_BACKEND_PROVIDER: supabase
          # Auth is still Supabase's; the tables are not. Without these the
          # suite reads the pre-cutover copy of the database, where
          # `ensure_user_provisioned` does not exist (404) and `profiles` is
          # frozen — which is why the sharing spec saw an empty directory and
          # the relay spec never had its request claimed, while both passed
          # locally against the same code.
          NEXT_PUBLIC_DATA_URL: https://api.weaveforge.org
          NEXT_PUBLIC_REALTIME_URL: https://api.weaveforge.org

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run Playwright end-to-end tests
        run: npm run test:e2e --workspace @weaveforge/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Same reason as the build step above: the data lives here now.
          NEXT_PUBLIC_DATA_URL: https://api.weaveforge.org
          NEXT_PUBLIC_REALTIME_URL: https://api.weaveforge.org
          WEAVEFORGE_EMAIL: ${{ secrets.TT_A_EMAIL }}
          WEAVEFORGE_PASSWORD: ${{ secrets.TT_A_PASSWORD }}
          TT_A_EMAIL: ${{ secrets.TT_A_EMAIL }}
          TT_A_PASSWORD: ${{ secrets.TT_A_PASSWORD }}
          # The sharing spec needs a second account. Without these it skipped,
          # and a skip is indistinguishable from a pass in the job summary.
          TT_B_EMAIL: ${{ secrets.TT_B_EMAIL }}
          TT_B_PASSWORD: ${{ secrets.TT_B_PASSWORD }}
          TEST_ACCOUNT_EMAIL_PRIMARY: ${{ secrets.TEST_ACCOUNT_EMAIL_PRIMARY }}
          TEST_ACCOUNT_EMAIL_SECONDARY: ${{ secrets.TEST_ACCOUNT_EMAIL_SECONDARY }}
          TEST_ACCOUNT_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      # Two specs fail here and pass on a developer's machine against the same
      # backend, production build included. Nothing in the job's own output says
      # why, so keep what Playwright already recorded: the trace it captures on
      # the retry has the failing page's console and every request it made.
      - name: Keep the failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7

  dco:
    # Only on pull requests: the rule is enforced on what a PR adds, and the
    # history before this job existed has no sign-offs to find.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The default shallow clone cannot walk base..head.
          fetch-depth: 0

      # The shell version, which is what this job has always run. It stays the
      # authority for CI on Linux, and the Node version below runs beside it so a
      # divergence between the two — the only thing that could silently change
      # which sign-offs count — fails the pull request instead of going unnoticed.
      - name: Check sign-offs (shell)
        run: >
          scripts/check-dco.sh
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

      # The same rule again through scripts/check-dco.mjs, which is the copy a
      # Windows contributor can actually run: the shell version needs bash, and
      # until this existed the only DCO gate in the repository was unreachable
      # from the platform the desktop app ships on. No setup step is needed —
      # ubuntu-latest has Node.
      - name: Check sign-offs (Node, same rule)
        run: >
          node scripts/check-dco.mjs
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python SDK
        working-directory: python
        run: pip install -e '.[dev]' ruff mypy

      - name: Lint (ruff)
        working-directory: python
        run: ruff check weaveforge tests

      - name: Type-check (mypy)
        working-directory: python
        run: mypy

      - name: Run Python tests
        working-directory: python
        run: pytest -q
