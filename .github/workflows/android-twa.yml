name: Build Android TWA

# Builds + signs the TWA APK/AAB from the committed Bubblewrap project.
# Trigger: tag android-v* (e.g. android-v3) or workflow_dispatch.
# Python SDK releases use vX.Y.Z tags — those must NOT build Android.
#
# Prerequisites (one time, done locally — see apps/web/twa/README.md):
#   1. Bubblewrap project committed under apps/web/twa/ (keystore gitignored).
#   2. Repo Secrets: ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD,
#      ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS
#   3. assetlinks.json SHA-256 matches this keystore (run android-fingerprint.yml).

on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web/twa
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_B64 secret missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > android-keystore.jks

      - name: Verify assetlinks fingerprint matches keystore
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          ALIAS="${KEY_ALIAS:-weaveforge}"
          # Read keytool fully before parsing. Piping straight into `awk ... exit`
          # closes the pipe while keytool is still writing, so keytool takes
          # SIGPIPE and `pipefail` fails the step before it prints anything —
          # which is why this job had never got past this point.
          if ! KEYTOOL_OUT=$(keytool -list -v -keystore android-keystore.jks \
                -storepass "$STORE_PASS" -alias "$ALIAS" 2>&1); then
            echo "::error::keytool could not read alias '$ALIAS' from the keystore."
            echo "Check ANDROID_KEY_ALIAS and ANDROID_KEYSTORE_PASSWORD."
            echo "$KEYTOOL_OUT" | tail -5
            exit 1
          fi
          FP=$(printf '%s\n' "$KEYTOOL_OUT" | awk '/SHA256:/{print $2; exit}')
          if [ -z "$FP" ]; then
            echo "::error::No SHA-256 fingerprint found for alias '$ALIAS'."
            exit 1
          fi
          echo "Keystore SHA-256: $FP"
          ASSETLINKS="../../public/.well-known/assetlinks.json"
          if ! grep -q "$FP" "$ASSETLINKS"; then
            echo "::error::$ASSETLINKS is missing fingerprint $FP — URL bar will show in the TWA."
            echo "Update assetlinks.json, deploy the web app, then re-run."
            exit 1
          fi

      - name: Build signed APK + AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weaveforge-android
          path: |
            apps/web/twa/app-release-signed.apk
            apps/web/twa/app-release-bundle.aab
          if-no-files-found: error

      - name: Attach artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Create the release if this was a bare tag push
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Android ${TAG#android-}" \
              --notes "WeaveForge Android TWA (${TAG}). Sideload the APK or upload the AAB to Play Console."
          fi
          gh release upload "$TAG" \
            app-release-signed.apk \
            app-release-bundle.aab \
            --clobber

      - name: Shred keystore
        if: always()
        run: rm -f android-keystore.jks
