name: Build Android TWA

# Builds + signs the TWA APK/AAB from the committed Bubblewrap project.
# Runs on a version tag (v*) or manually. The signing keystore is injected
# from GitHub Secrets — it is never committed to the repo.
#
# Prerequisites (one time, done locally — see apps/web/twa/README.md):
#   1. `bubblewrap init` has been run in apps/web/twa/ and the generated Android
#      project (app/, gradle files, twa-manifest.json) IS committed — EXCEPT the
#      keystore (*.jks is gitignored).
#   2. These repo Secrets exist (Settings → Secrets and variables → Actions):
#        ANDROID_KEYSTORE_B64      base64 of android-keystore.jks
#        ANDROID_KEYSTORE_PASSWORD keystore password
#        ANDROID_KEY_PASSWORD      key/alias password
#        ANDROID_KEY_ALIAS         key alias (e.g. weaveforge)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web/twa
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > android-keystore.jks

      - name: Build signed APK + AAB
        env:
          # Bubblewrap reads these to sign non-interactively.
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weaveforge-android
          path: |
            apps/web/twa/app-release-signed.apk
            apps/web/twa/app-release-bundle.aab
          if-no-files-found: error

      - name: Shred keystore
        if: always()
        run: rm -f android-keystore.jks
