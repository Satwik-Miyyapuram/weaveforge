name: Build Android

# Builds and signs the native Android app (apps/android, org.weaveforge.ink) and
# attaches one APK, WeaveForge-<version>-Android.apk, to the release.
# Trigger: tag android-v* (e.g. android-v0.8.0) or workflow_dispatch.
# Secrets: ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD,
# ANDROID_KEY_ALIAS; build.gradle.kts reads them from the environment.

on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:

env:
  RELEASE_NOTES: >-
    WeaveForge for Android: install WeaveForge-<version>-Android.apk (the app with ink and the
    deadlines widget).

jobs:
  native:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testReleaseUnitTest

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_B64 secret missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/android-keystore.jks"

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/android-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'weaveforge' }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleRelease
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          APK="WeaveForge-$VER-Android.apk"
          # Without a keystore Gradle writes app-release-unsigned.apk, so this cp fails.
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -m1 'SHA-256'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weaveforge-android
          path: apps/android/WeaveForge-*-Android.apk
          if-no-files-found: error

      - name: Attach artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # The desktop updater reads GitHub's "latest" release, so that must stay on a v* tag.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Android ${TAG#android-}" \
              --latest=false \
              --notes "$RELEASE_NOTES" || gh release view "$TAG" >/dev/null
          fi
          gh release upload "$TAG" WeaveForge-*-Android.apk --clobber

      - name: Shred keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/android-keystore.jks"
