name: Publish Python SDK

# Publishes thesis-tracker to PyPI on a GitHub Release using PyPI Trusted
# Publishing (OIDC) — no API token stored. Configure the trusted publisher once
# at https://pypi.org/manage/project/thesis-tracker/settings/publishing/
# (workflow: publish-python.yml, environment: pypi).

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read   # required for actions/checkout
      id-token: write   # required for trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build sdist + wheel
        working-directory: python
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          # Preferred: PyPI Trusted Publishing (OIDC) via the `pypi` environment.
          # Fallback: set `PYPI_API_TOKEN` in the `pypi` environment secrets.
          # - Token value should be the full `pypi-...` string (NOT base64).
          # - If provided, it bypasses trusted publishing and uses an API token.
          password: ${{ secrets.PYPI_API_TOKEN }}
