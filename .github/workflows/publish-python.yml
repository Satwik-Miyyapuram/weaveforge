name: Publish Python SDK

# Publishes the `weaveforge` SDK to PyPI when an SDK tag is pushed.
# Tags: py-vX.Y.Z (e.g. py-v0.6.0).
#
# The prefix separates the tracks. `vX.Y.Z` is the desktop app, and it creates a
# GitHub Release; while this workflow also answered to `v*` and to any published
# release, cutting a desktop release meant an unintended PyPI upload — and a
# PyPI version cannot be taken back and re-used. Android is `android-v*`.
#
# Preferred auth: PyPI Trusted Publishing (OIDC) via the `pypi` environment.
# Fallback: PYPI_API_TOKEN secret (full `pypi-...` string).

on:
  push:
    tags: ["py-v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    # `id-token: write` is what Trusted Publishing (OIDC) needs — it is how the
    # job proves to PyPI that it is this workflow in this repository, so the
    # token is minted per run and there is no long-lived publish secret to leak.
    # `contents: read` is all the checkout needs. Nothing here needs any other
    # scope, which matters because this job holds a credential that can publish
    # a version nobody can ever take back.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # PyPI rejects a version it already has, and it rejects it after the
      # build, with a message about a file rather than about the tag. Comparing
      # here says which of the two is wrong while it can still be fixed.
      - name: Check the tag matches the SDK version
        if: startsWith(github.ref, 'refs/tags/py-v')
        run: |
          tag="${GITHUB_REF#refs/tags/py-v}"
          pkg="$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('python/weaveforge/__init__.py').read_text()).group(1))")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag py-v$tag does not match python/weaveforge/__init__.py $pkg" >&2
            exit 1
          fi

      - name: Build sdist + wheel
        working-directory: python
        run: |
          python -m pip install --upgrade build
          python -m build

      # Pinned to a commit, not to the `release/v1` branch. A mutable branch ref
      # on the step that carries the publishing credential means whoever can move
      # that branch decides what runs with this job's OIDC token — the same
      # argument that has this repository lockfile its npm and Python
      # dependencies applies to the action that uploads to PyPI. The SHA is the
      # tip of `release/v1`, and it is also the commit the current release
      # `v1.14.2` is tagged at, which is the version recorded here. Bumping it is
      # a deliberate commit, reviewed like any other — not something a re-run
      # picks up on its own.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: python/dist
          password: ${{ secrets.PYPI_API_TOKEN }}
