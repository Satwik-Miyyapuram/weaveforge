name: Publish Python SDK

# Publishes weaveforge to PyPI when a semver SDK tag is pushed / released.
# Tags: vX.Y.Z only (e.g. v1.2.3). Android uses android-v* — never this workflow.
#
# Preferred auth: PyPI Trusted Publishing (OIDC) via the `pypi` environment.
# Fallback: PYPI_API_TOKEN secret (full `pypi-...` string).

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    # Skip Android releases and non-semver tags that might still hit `release`.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'release' &&
        startsWith(github.event.release.tag_name, 'v') &&
        !startsWith(github.event.release.tag_name, 'android-') &&
        contains(github.event.release.tag_name, '.'))
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build sdist + wheel
        working-directory: python
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          password: ${{ secrets.PYPI_API_TOKEN }}
