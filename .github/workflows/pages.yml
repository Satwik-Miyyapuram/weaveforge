name: Pitch and docs site

# Publishes the statically exported pitch site (apps/pitch) to GitHub Pages.
#
# The site renders the product's own page component from apps/web, so a change
# to the real EntityCard or to the graph palette republishes the marketing page
# too — which is the point of building it this way rather than as a copy.

on:
  push:
    branches: [main]
    paths:
      - "apps/pitch/**"
      - "docs/**"
      - "apps/web/src/app/pitch/**"
      - "apps/web/src/app/globals.css"
      - "apps/web/src/app/themes.css"
      - "apps/web/src/components/**"
      - "apps/web/src/features/relations/domain/**"
      - "apps/web/public/icons/**"
      - "packages/core/src/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued runs supersede rather than race.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the static export
        env:
          # Served from docs.weaveforge.org (apps/pitch/public/CNAME), so the
          # site is at the root of its own host and needs no prefix. It was
          # /<repo> while this served from user.github.io/<repo>; leaving that
          # set behind a custom domain prefixes every asset with a path that
          # does not exist there.
          BASE_PATH: ""
          # Where "Open the app" points. This page is a different origin from
          # the product, so the link has to be absolute or it loops the visitor
          # back to the marketing site. The default is the production app; set
          # the APP_URL repository variable to send this build somewhere else.
          # It must stay a URL that opens the app — a button labelled "Open the
          # app" that lands on a source repository is a broken promise, which
          # is exactly what the previous fallback did.
          NEXT_PUBLIC_APP_URL: ${{ vars.APP_URL || 'https://www.weaveforge.org' }}
        run: npm run build --workspace @weaveforge/pitch

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/pitch/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
