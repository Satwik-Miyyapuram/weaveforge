# Thesis Tracker — OCI Phase 3 (Postgres + MinIO)
# Copy to your VM: ~/thesis-infra/docker-compose.yml
# Configure: cp .env.example .env && nano .env

services:
  postgres:
    image: postgres:16
    container_name: thesis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thesis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-thesis}
    ports:
      - "5432:5432"
    volumes:
      - ${PGDATA_HOST:-/mnt/pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thesis} -d ${POSTGRES_DB:-thesis}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The data API the browser talks to.
  #
  # Supabase's REST endpoint *is* PostgREST, so running it here lets the client
  # keep speaking the protocol it already speaks — no rewrite of the twenty-two
  # browser repositories. Auth stays with Supabase; PGRST_JWT_SECRET is the same
  # secret Supabase signs its tokens with, so the tokens it issues validate here.
  postgrest:
    image: postgrest/postgrest:latest
    container_name: thesis-postgrest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Connects as the owner; PostgREST switches to the role in the JWT per
      # request, which is what makes RLS apply.
      PGRST_DB_URI: postgres://${POSTGRES_USER:-thesis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-thesis}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:?Set SUPABASE_JWT_SECRET in .env}
      # Supabase signs with HS256 and a plain secret, not a JWKS.
      PGRST_JWT_SECRET_IS_BASE64: "false"
      PGRST_DB_USE_LEGACY_GUCS: "true"
      PGRST_SERVER_PORT: 3000
      # Browsers send an Origin; without this every request is a CORS failure.
      PGRST_SERVER_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio:
    image: minio/minio:latest
    container_name: thesis-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-thesisminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ${MINIO_DATA_HOST:-/mnt/minio}:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
