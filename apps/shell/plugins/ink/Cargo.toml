[package]
name = "tauri-plugin-ink"
description = "The Android ink overlay (pen surface and gesture routing) for the WeaveForge shell."
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
publish = false
links = "tauri-plugin-ink"

[dependencies]
tauri = { version = "=2.12.5", features = [] }

[build-dependencies]
tauri-plugin = { version = "=2.7.2", features = ["build"] }

[lints.rust]
unused_must_use = "deny"
unused_results = "deny"
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
