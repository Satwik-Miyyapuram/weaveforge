# WeaveForge desktop shell on Tauri 2. Design: docs/plans/current/rust-port/phase-2-desktop.md.
# Its own workspace: Tauri brings many duplicate crate versions, and the root
# workspace's cargo-deny bans must stay strict for wf-core (design § Steps 2.2).
[workspace]

[package]
name = "weaveforge-shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
repository = "https://github.com/Satwik-Miyyapuram/weaveforge"
publish = false

[lib]
name = "weaveforge_shell"

# Exact pins, as in the root workspace: Tauri 2.x minor releases change behaviour.
[dependencies]
tauri = { version = "=2.12.5", features = [] }
# Sidecar client (step 2.4): async child process, Job Object on Windows so the
# sidecar dies with the shell. The std API of process-wrap never sets kill-on-close.
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "job-object", "kill-on-drop", "creation-flags"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["io-util", "process", "rt", "sync", "time"] }
# Typed commands: tauri-specta generates bridge/bindings.ts from the command signatures.
# Specta v2 is a release candidate; the pins must move together.
serde = { version = "=1.0.229", features = ["derive"] }
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
specta-typescript = { version = "=0.0.13", features = ["serde"] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
# Error enums (plan §4.7); same pin as the root workspace.
thiserror = "=2.0.21"
# Secrets (step 2.8): keyring-core picks no store itself; the shell sets the
# platform's native store at start, and tests use its mock store.
keyring-core = "=1.0.1"
# Vault, root confinement and search logic shared with the web build (plan §4.1).
wf-store = { path = "../../crates/wf-store" }
# Relays (step 2.9): the shell fetches papers, pages and APIs the page cannot reach.
# Same reqwest tauri already locks. native-tls, not rustls: rustls's default
# aws-lc-rs needs cmake and nasm to build; native-tls uses schannel on Windows,
# Security.framework on macOS, and on Linux the OpenSSL git2 already vendors.
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls-vendored"] }
# The HTML relay decodes a page by the charset it declares: the same WHATWG labels
# the TS relay's TextDecoder takes.
encoding_rs = "=0.8.35"
# Page titles for paste (step 2.9e): the same patterns as packages/core page-title.ts.
# Already in the lock through tauri.
regex = "=1.13.1"
# Bytes cross the bridge as base64 text (vault PDFs, images, compiled PDFs): JSON
# number arrays would be three to four times larger. Already in the lock through tauri.
base64 = "=0.23.1"

[target.'cfg(windows)'.dependencies]
# Same version process-wrap uses; only for the CREATE_NO_WINDOW flag type.
windows = { version = "=0.62.2", default-features = false, features = ["Win32_System_Threading"] }
# Windows Credential Manager store for keyring-core; search is not needed.
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS login keychain store for keyring-core.
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Secret Service (GNOME Keyring, KWallet) over libdbus, with an encrypted session
# in pure-Rust crypto (the crate does not build without a crypto feature).
# Builds need libdbus-1-dev.
dbus-secret-service-keyring-store = { version = "=1.0.1", features = ["crypto-rust"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

# Same rules as the root workspace (plan §4.2/§4.3).
[lints.rust]
unused_must_use = "deny"
unused_results = "deny"
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
too_many_lines = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"
checked_conversions = "deny"
must_use_candidate = "deny"
needless_pass_by_value = "deny"
redundant_closure_for_method_calls = "deny"
semicolon_if_nothing_returned = "deny"

[profile.release]
debug-assertions = false
overflow-checks = true
