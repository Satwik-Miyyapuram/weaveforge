[package]
name = "wf-relay-server"
description = "The relay server on OCI: the web app's outside fetches (papers, pages, APIs) over HTTP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
wf-relay = { path = "../wf-relay" }
wf-core = { path = "../../../crates/wf-core" }
axum = { version = "=0.8.4", default-features = false, features = ["http1", "json", "query", "tokio"] }
tower-http = { version = "=0.6.11", default-features = false, features = ["cors"] }
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls-vendored"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# API-token hashes and the HS256 session token, as the web's requireSdkUser does.
sha2 = "=0.10.9"
hmac = "=0.12.1"
base64 = "=0.23.1"
url = "=2.5.8"
# Random bytes for lab invite codes.
getrandom = "=0.2.17"

[dev-dependencies]
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
