[package]
name = "wf-relay-server"
description = "The relay server on OCI: outside fetches, auth, live collab rooms and SDK metrics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
wf-relay = { path = "../wf-relay" }
wf-core = { path = "../../../crates/wf-core" }
axum = { version = "=0.8.4", default-features = false, features = ["http1", "json", "multipart", "query", "tokio", "ws"] }
tower-http = { version = "=0.6.11", default-features = false, features = ["cors"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
reqwest = { workspace = true, features = ["native-tls-vendored"] }
serde.workspace = true
serde_json.workspace = true
# API-token hashes and the HS256 session token, as the web's requireSdkUser does.
sha2.workspace = true
hmac = "=0.12.1"
base64 = "=0.23.1"
url.workspace = true
# Random bytes for lab invite codes.
getrandom = "=0.4.3"
# AES-256-GCM for stored credentials, as the web's credential-crypto does.
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc"] }
# Co-editing (L8): the relay keeps one Yjs document per shared item.
yrs = "=0.28.1"

[dev-dependencies]
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
# A WebSocket client for the co-editing socket tests (same version axum uses).
tokio-tungstenite = { version = "=0.26.2", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
# Property tests for the feed token lookup (the hash, never the token, goes upstream).
proptest.workspace = true

[lints]
workspace = true
