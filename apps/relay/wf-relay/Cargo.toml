[package]
name = "wf-relay"
description = "Relays and pasted-link fetches shared by the desktop shell and the relay server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# TypeScript types for the paste replies; the shell turns it on for its generated bindings.
specta = ["dep:specta"]

# Pins come from the root [workspace.dependencies], so the shell builds one copy of each.
[dependencies]
tokio = { workspace = true, features = ["io-util", "net", "rt", "time"] }
serde.workspace = true
serde_json.workspace = true
specta = { workspace = true, optional = true }
# The HTML relay decodes a page by the charset it declares: the same WHATWG labels
# the TS relay's TextDecoder takes.
encoding_rs = "=0.8.44"
# Page titles for paste: the same patterns as packages/core page-title.ts.
regex = "=1.13.1"
base64 = "=0.23.1"

# Desktops and the server: TLS from the platform. native-tls, not rustls: rustls's
# default aws-lc-rs needs cmake and nasm to build; native-tls uses schannel on Windows,
# Security.framework on macOS and a vendored OpenSSL on Linux.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
reqwest = { workspace = true, features = ["native-tls-vendored"] }

# Phones: rustls on ring with Mozilla's roots (see src/tls.rs).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
reqwest = { workspace = true, features = ["rustls-no-provider"] }
webpki-root-certs = "=1.0.11"

[dev-dependencies]
# tls.rs tests the phone roots on desktops too.
webpki-root-certs = "=1.0.11"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
