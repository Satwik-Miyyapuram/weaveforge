# cargo deny check for the relay workspace. Same licence, source and advisory
# policy as the root deny.toml. It is a workspace of its own so its reqwest and
# tokio graph never loosens wf-core's strict duplicate-version check.
[graph]
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-linux-android",
  "aarch64-apple-ios",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
  "AGPL-3.0-only",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# Mozilla's CA list as data (CDLA-Permissive-2.0): phones bundle it as their TLS
# roots (tls.rs), and the tests use it too.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
skip = [
  { crate = "syn@2", reason = "openssl-macros (native-tls for reqwest) still on syn 2; build-time only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
