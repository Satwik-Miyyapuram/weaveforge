# cargo deny check for the relay crates. Same licence, source and advisory
# policy as the root deny.toml. The root check excludes them, so their reqwest
# and tokio graph never loosens wf-core's strict duplicate-version check.
[graph]
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-linux-android",
  "aarch64-apple-ios",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2026-0215", reason = "smallstr is unmaintained, not vulnerable; pulled in by yrs 0.28.1 (pinned =0.28.1 in server/Cargo.toml) with no release that drops it. Revisit when yrs ships a release without smallstr, or on any new yrs version." },
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
  "AGPL-3.0-only",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# Mozilla's CA list as data (CDLA-Permissive-2.0): phones bundle it as their TLS
# roots (tls.rs), and the tests use it too.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
skip = [
  { crate = "syn@2", reason = "openssl-macros (native-tls for reqwest) still on syn 2; build-time only" },
  { crate = "base64@0.22", reason = "axum's ws feature (tungstenite handshake) pins base64 0.22; hyper-util is on 0.23" },
  { crate = "getrandom@0.3", reason = "tungstenite's rand 0.9 (ws mask keys) is on getrandom 0.3; the server uses 0.4" },
  { crate = "hashbrown@0.14", reason = "yrs (co-editing) uses dashmap 6, which is on hashbrown 0.14" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
