[package]
name = "weaveforge-setup"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "WeaveForge's Windows installer window"
publish = false

[[bin]]
name = "weaveforge-setup"
path = "src/main.rs"

[dependencies]
tao = "0.37"
wry = "0.57"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
