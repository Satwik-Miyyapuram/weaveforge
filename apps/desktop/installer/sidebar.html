<!doctype html><html><head><meta charset="utf-8"><style>
/* The setup window's art panel (setup/ui/index.html), laid out at its 248px and zoomed to NSIS's 164x314. */
@font-face { font-family: Rubik; src: url(setup/ui/rubik.woff2) format("woff2"); font-weight: 300 900; }
:root {
  --surface: #ffe7c1; --surface2: #f1d5a7; --line: #2b222b; --text: #2b222b; --muted: #5c4b51; --accent: #1f6dab;
  --chip-to-read: #f29731; --chip-reading: #8db7d0; --chip-read: #6cbf81;
  --radius: 8px; --bw: 3px; --sh-card: 0 6px 0 #2b222b; --mono: ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box; }
html { zoom: 0.6613; }
html, body { margin: 0; overflow: hidden; }
body { width: 248px; height: 475px; color: var(--text); font: 400 13.5px/1.5 Rubik, "Segoe UI", sans-serif; }
.art {
  height: 100%; overflow: hidden; background: var(--surface2);
  display: flex; flex-direction: column; gap: 11px; padding: 24px 18px 14px;
  border-right: var(--bw) solid var(--line);
}
.auth-brand { display: flex; align-items: center; gap: 8px; }
.auth-brand svg { width: 26px; height: 26px; flex: none; }
.auth-brand strong { font-size: 14px; font-weight: 700; letter-spacing: -.2px; }
.auth-title { margin: 2px 0 0; font-size: 19px; font-weight: 800; line-height: 1.02; letter-spacing: -.4px; }
.auth-lede { margin: 0; font-size: 11px; line-height: 1.4; color: var(--muted); }
.auth-cards { display: grid; gap: 9px; padding: 3px 2px; }
.auth-card {
  display: grid; gap: 3px; align-content: start; padding: 7px 9px;
  border: var(--bw) solid var(--line); border-radius: var(--radius);
  background: color-mix(in srgb, var(--chip-fill) 35%, var(--surface)); box-shadow: var(--sh-card);
}
.auth-card--reading { --chip-fill: var(--chip-reading); transform: rotate(-2.5deg); }
.auth-card--running { --chip-fill: var(--chip-read); transform: rotate(2deg) translateY(6px); }
.auth-card--draft { --chip-fill: var(--chip-to-read); transform: rotate(-1deg) translateX(3px); }
.auth-card strong { font-size: 10.5px; font-weight: 700; line-height: 1.3; }
.auth-chip { justify-self: start; padding: 1px 7px; border-radius: 999px; border: var(--bw) solid var(--line); background: var(--chip-fill); font-family: var(--mono); font-size: 9px; }
.auth-meta { font-family: var(--mono); font-size: 9px; color: var(--muted); }
.auth-foot { margin: auto 0 0; font-family: var(--mono); font-size: 9px; color: var(--muted); }
</style></head><body>
  <aside class="art">
    <div class="auth-brand">
      <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WeaveForge">
        <rect width="512" height="512" rx="115" fill="var(--surface2)" />
        <path d="M 230 125 L 194 125 A 54 54 0 0 0 140 179 L 140 355 A 54 54 0 0 0 194 409 L 318 409 A 54 54 0 0 0 372 355 L 372 265"
              fill="none" stroke="var(--text)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
        <line x1="264" y1="125" x2="264" y2="215" stroke="var(--text)" stroke-width="12" stroke-linecap="round" />
        <line x1="264" y1="215" x2="356" y2="139" stroke="var(--text)" stroke-width="12" stroke-linecap="round" />
        <line x1="264" y1="215" x2="372" y2="229" stroke="var(--text)" stroke-width="12" stroke-linecap="round" />
        <circle cx="264" cy="125" r="22" fill="var(--text)" />
        <circle cx="264" cy="215" r="22" fill="var(--text)" />
        <circle cx="356" cy="139" r="22" fill="var(--accent)" />
        <circle cx="372" cy="229" r="22" fill="var(--text)" />
      </svg>
      <strong>WeaveForge</strong>
    </div>
    <h1 class="auth-title">Research,<br>unified.</h1>
    <p class="auth-lede">Papers, notes and experiments, woven into one space.</p>
    <div class="auth-cards">
      <div class="auth-card auth-card--reading"><span class="auth-chip">Reading</span><strong>Locating and editing factual associations in GPT</strong><span class="auth-meta">Meng et al. · 2022</span></div>
      <div class="auth-card auth-card--running"><span class="auth-chip">Running</span><strong>EXP-07 ROME layer sweep</strong><span class="auth-meta">epoch 6 of 10</span></div>
      <div class="auth-card auth-card--draft"><span class="auth-chip">Draft</span><strong>Chapter 3 outline</strong><span class="auth-meta">612 words · 2 backlinks</span></div>
    </div>
    <p class="auth-foot">Private by default · works offline</p>
  </aside>
</body></html>
