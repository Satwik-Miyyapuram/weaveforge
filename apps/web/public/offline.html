<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>WeaveForge · offline</title>
<link rel="icon" href="/icons/weave_forge.svg">
<!--
  Served by the service worker (src/sw.ts) when opening a page fails because
  there is no network. Pages themselves are never cached — each deploy changes
  the chunks they name — so this file stands alone: no Next chunks, no fonts
  fetched, nothing that could be missing when it is needed.
-->
<style>
  :root {
    --bg: #000000; --surface: #11111b; --ink: #cdd6f4; --muted: #a6adc8;
    --line: #cdd6f4; --accent: #cba6f7; --accent-ink: #11111b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
  body {
    font-family: Rubik, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; place-items: center; min-height: 100vh; min-height: 100dvh;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main {
    width: min(460px, 100%); background: var(--surface);
    border: 3px solid var(--line); box-shadow: 6px 6px 0 var(--accent); padding: 28px;
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; font-weight: 700; font-size: 18px; }
  .brand img { width: 40px; height: 40px; border: 3px solid var(--line); }
  h1 { font-size: 26px; margin: 0 0 10px; line-height: 1.2; }
  p { color: var(--muted); line-height: 1.55; margin: 0 0 22px; }
  button {
    font: inherit; font-weight: 700; font-size: 16px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
    border: 3px solid var(--line); box-shadow: 4px 4px 0 var(--line);
    padding: 10px 20px; transition: filter 120ms, transform 120ms, box-shadow 120ms;
  }
  button:hover { filter: brightness(1.15); }
  button:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--line); }
  button:focus { outline: none; }
  button:focus-visible { outline: 3px solid #f5c2e7; outline-offset: 3px; }
  .status { margin: 16px 0 0; font-size: 14px; min-height: 1.4em; }
</style>
</head>
<body>
<main>
  <div class="brand"><img src="/icons/apple-touch-icon.png" alt="">WeaveForge</div>
  <h1>You're offline</h1>
  <p>This page needs a connection to open. Your notes are safe, and anything you changed is sent
    the next time you're online. This page reloads by itself once the connection is back.</p>
  <button type="button" id="retry">Try again</button>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</main>
<script>
  (function () {
    var status = document.getElementById("status");
    function retry() {
      if (navigator.onLine === false) {
        status.textContent = "Still offline.";
        return;
      }
      status.textContent = "Reconnecting…";
      location.reload();
    }
    document.getElementById("retry").addEventListener("click", retry);
    window.addEventListener("online", retry);
  })();
</script>
</body>
</html>
