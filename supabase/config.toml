# Minimal Supabase CLI config.
# Kept for auth settings only; migrations live in db/ (see db/README.md).
project_id = "weaveforge"

[auth]
# Disable email confirmations locally so that signing up registers the user immediately
[auth.email]
enable_signup = true
enable_confirmations = false

[auth.email.template.magic_link]
subject = "Your WeaveForge confirmation code"
content_path = "./templates/magic_link.html"

